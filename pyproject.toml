[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fadingmem"
version = "0.1.0"
description = "Fading Memory: where state-space models fail on recall and state tracking, and what fixes them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
# Triton ships with the Linux/WSL2 PyTorch wheels. On native Windows use `triton-windows`.
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
