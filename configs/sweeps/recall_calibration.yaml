# Calibrate the recall (MQAR) training budget before the capacity sweep.
# The first capacity sweep (4k steps, length 512, vocabulary 4096) mostly measured *whether* a run
# happened to "click" in time, not capacity: even attention stayed at 12-30%. Here every model gets
# up to 20k steps with early stopping; steps_to_90 in summary.csv records when each one clicks.
name: recall_calibration
base: ../mqar.yaml
overrides:
  task.seq_len: 256
  task.num_kv_pairs: 16
  task.vocab_size: 512
  train.steps: 20000
  train.lr: 0.001
  train.eval_every: 500
  train.early_stop_acc: 0.99
axes:
  model:
    - {label: attention,      set: {model.pattern: A}}
    - {label: attention_conv, set: {model.pattern: A, model.attn: {n_heads: 1, short_conv: 4}}}
    - {label: ssm,            set: {model.pattern: M}}
    - {label: deltanet,       set: {model.pattern: D}}
