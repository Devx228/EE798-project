# RQ1: how much can a fixed-size state recall? (v2, budget set by recall_calibration)
# Calibration (16 pairs): with up to 20k steps every model reaches 99%; plain attention needs ~6.5k
# steps to click, attention + short conv ~0.5k, so the conv variant is the attention baseline here.
# Expectation: attention stays near 100% as pairs grow; recurrent models degrade once the number of
# pairs outgrows their state, later for larger states (SSM N=16 vs N=64, DeltaNet).
# The superseded first attempt (4k steps) is in results/recall_capacity_v1.
name: recall_capacity_v2
base: ../mqar.yaml
overrides:
  task.seq_len: 256
  task.vocab_size: 512
  train.steps: 20000
  train.lr: 0.001
  train.eval_every: 500
  train.early_stop_acc: 0.99
axes:
  model:
    - {label: attention_conv, set: {model.pattern: A, model.attn: {n_heads: 1, short_conv: 4}}}
    - {label: ssm,            set: {model.pattern: M}}
    - {label: ssm_N64,        set: {model.pattern: M, model.ssm: {d_state: 64, expand: 2, head_dim: 32}}}
    - {label: deltanet,       set: {model.pattern: D}}
  kv:
    - {label: kv16, set: {task.num_kv_pairs: 16}}
    - {label: kv32, set: {task.num_kv_pairs: 32}}
    - {label: kv64, set: {task.num_kv_pairs: 64}}
